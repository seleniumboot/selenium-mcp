[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seleniumboot-mcp"
version = "0.5.0"
description = "A Python MCP server for Selenium WebDriver — 85 tools for browser automation, alerts, frames, shadow DOM, cookies, mobile emulation, self-healing locators, and codegen for Java/C#/Python/Playwright/CI pipelines"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Raza Tech", email = "razatechnologyservices@gmail.com" }]
keywords = ["selenium", "mcp", "test-automation", "webdriver", "testng", "junit", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    # server.py was migrated to the mcp 2.0 API in 0.5.0 — the decorators this
    # server used to register with (Server.list_tools / Server.call_tool) were
    # removed in 2.0.0 and are gone for good (#2). 1.x is therefore no longer
    # supported: the floor, not a ceiling, is what's load-bearing now.
    # An upper bound goes back the moment mcp 3.0 is on the horizon —
    # Dependabot opens that PR (.github/dependabot.yml); do not merge it
    # without running the selenium-mcp-test gate first.
    "mcp>=2.0.0",
    "selenium>=4.6.0",
]

[project.urls]
Homepage = "https://github.com/seleniumboot/selenium-mcp"
Repository = "https://github.com/seleniumboot/selenium-mcp"
Issues = "https://github.com/seleniumboot/selenium-mcp/issues"

[project.scripts]
seleniumboot-mcp = "selenium_mcp.server:run"

[tool.setuptools.packages.find]
where = ["src"]
